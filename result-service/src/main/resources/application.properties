server.port=8084
spring.application.name=result-service

spring.datasource.url=jdbc:postgresql://localhost:5433/civicvote_result
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# MUST match auth-service and voting-service
jwt.secret=civicvote_super_secret_key_for_jwt_signing_2026

# shared key for service-to-service calls (must match voting-service)
internal.api-key=civicvote_internal_key_2026