server.port=8083
spring.application.name=voting-service

spring.datasource.url=jdbc:postgresql://localhost:5433/civicvote_voting
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# MUST be identical to jwt.secret in auth-service
jwt.secret=civicvote_super_secret_key_for_jwt_signing_2026

# secret used to hash voter ids
voting.hash-secret=civicvote_voter_hash_secret_2026
internal.api-key=civicvote_internal_key_2026