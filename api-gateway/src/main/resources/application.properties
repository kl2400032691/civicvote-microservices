server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/**

spring.cloud.gateway.server.webmvc.routes[1].id=election-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://election-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/elections/**


spring.cloud.gateway.server.webmvc.routes[2].id=voting-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://voting-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/votes/**

spring.cloud.gateway.server.webmvc.routes[3].id=result-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://result-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/results/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true